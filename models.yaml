# Single source of truth for model assignments: profile -> role -> model id.
# Run scripts/apply-models.py after editing to regenerate agents/generated/
# and opencode.json.sample.
#
# ds+glm (default): GLM plan credits are charged on cached
# context re-reads too (input 6.9 / cached 1.7 / output 24 per 10k tokens
# for glm-5.3), so any many-turn seat on glm-5.3 dominates the weekly
# quota. Measured 2026-10: an operator on glm-5.3 burned ~75% of a week's
# credits in 351 steps, almost entirely cached input; DeepSeek carried
# ~80% of all steps for single-digit dollars pay-as-you-go. So GLM 5.3
# stays only on low-volume, high-stakes text seats plus language quality;
# every many-turn seat runs on pay-as-you-go DeepSeek. Where GLM's
# independent failure modes are worth keeping but volume or vision rules
# out the flagship, glm-5.3-flash carries the seat: 3x plan quota, native
# multimodal input, and a 4.4x smaller KV cache, at a modest coding drop.
#
# glm-5.3 is text-only; glm-5.3-flash is native multimodal
# (image/video/file). visual-critic runs on glm-5.3-flash and
# visual-builder on vision-capable deepseek-flash, so the two use
# different vendors.
#
# Operator context is the cost center, not subagent count. Measured 2026-10
# over 988 sessions on this machine: chief operator sessions cost ~$65.53
# (2.37B cache-read tokens), while 235 scout sessions cost $4.66 and 38
# builder sessions cost $1.81. Cut turns and context at the top first.
#
# Subagent nesting: config subagent_depth is 2 (one nested level allowed).
# This is a latent switch, not a validated need. No subagent role grants
# `task`, so nothing nests today; all 571 subagent sessions were depth 1 and
# no session has ever compacted. Do not grant a subagent `task` (for example
# builder -> child worker) until one of these actually fires:
#   - a builder session compacts, or
#   - a builder task fails on context size, or
#   - a single-level builder returns repeated NEED-INPUT from context churn.

default_profile: ds+glm

profiles:
  ds:
    label: DeepSeek
    roles:
      # All-flash: DeepSeek is phasing out v4-pro; flash is ahead on performance and 3.3x-7.3x cheaper.
      chief: deepseek/deepseek-flash
      verifier: deepseek/deepseek-flash
      claim-critic: deepseek/deepseek-flash
      compliance-officer: deepseek/deepseek-flash
      product-critic: deepseek/deepseek-flash
      builder: deepseek/deepseek-flash
      system-fixer: deepseek/deepseek-flash
      external-researcher: deepseek/deepseek-flash
      code-locator: deepseek/deepseek-flash
      context-curator: deepseek/deepseek-flash
      wordsmith: deepseek/deepseek-flash
      phraser: deepseek/deepseek-flash
      visual-critic: deepseek/deepseek-flash
      visual-builder: deepseek/deepseek-flash
      photo-generator: deepseek/deepseek-flash
  glm:
    label: GLM
    roles:
      chief: zai-coding-plan/glm-5.3
      verifier: zai-coding-plan/glm-5.3
      claim-critic: zai-coding-plan/glm-5.3
      compliance-officer: zai-coding-plan/glm-5.3
      product-critic: zai-coding-plan/glm-5.3
      builder: zai-coding-plan/glm-5.3
      system-fixer: zai-coding-plan/glm-5.3
      external-researcher: zai-coding-plan/glm-5.3-flash
      code-locator: zai-coding-plan/glm-5.3-flash
      context-curator: zai-coding-plan/glm-5.3-flash
      wordsmith: zai-coding-plan/glm-5.3
      phraser: zai-coding-plan/glm-5.3
      visual-critic: zai/glm-4.6v
      visual-builder: zai/glm-4.6v-flash
      photo-generator: zai-coding-plan/glm-5.3
  ds+glm:
    label: DeepSeek + GLM hybrid
    # Agent ids are lowercase `<role>-ds+glm` (chief-ds+glm, verifier-ds+glm, ...);
    # the TUI prettifies ids for display (chief-ds+glm shows as Chief-Ds+Glm).
    roles:
      # Operator re-reads full session context every turn; pay-go beats plan credits.
      chief: deepseek/deepseek-flash
      # GLM research strength on the highest-stakes, lowest-turn text gates; the
      # vendor split also keeps the review layer independent of the DeepSeek
      # operator and builder.
      claim-critic: zai-coding-plan/glm-5.3
      compliance-officer: zai-coding-plan/glm-5.3
      # verifier is the one high-turn GLM gate (prove loops, suites); glm-5.3-flash
      # holds GLM's independent eyes at 3x plan quota and a 4.4x smaller KV cache.
      verifier: zai-coding-plan/glm-5.3-flash
      # product-critic flips to DeepSeek so the gates are not a one-vendor
      # monoculture; compliance-officer keeps GLM for regulatory precision.
      product-critic: deepseek/deepseek-flash
      # wordsmith keeps flagship prose: long-form wording is the seat's whole point.
      wordsmith: zai-coding-plan/glm-5.3
      # phraser is short, interactive riffing; glm-5.3-flash suffices and is cheaper.
      phraser: zai-coding-plan/glm-5.3-flash
      # Many-turn volume seats; deepseek-flash cache-hit input ~$0.003/1M off-peak.
      builder: deepseek/deepseek-flash
      system-fixer: deepseek/deepseek-flash
      external-researcher: deepseek/deepseek-flash
      code-locator: deepseek/deepseek-flash
      context-curator: deepseek/deepseek-flash
      # visual-critic on GLM's native multimodal lane, visual-builder on
      # vision-capable DeepSeek: critic and builder see with different eyes.
      visual-critic: zai-coding-plan/glm-5.3-flash
      visual-builder: deepseek/deepseek-flash
      photo-generator: deepseek/deepseek-flash
